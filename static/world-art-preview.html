<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>五境与妖傀 · 美术检视</title><link rel="stylesheet" href="/static/css/game.css">
<style>
main{max-width:1100px;margin:32px auto;padding:20px}h1{font-size:30px}
p{color:#b9c6d2;line-height:1.7}a{color:#e8c68b}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:20px 0}
select{background:#1b293b;color:#eee1c6;padding:9px;border:1px solid #5e7187}
canvas{width:100%;height:auto;image-rendering:pixelated;border:2px solid #60748a;background:#101722}
#art-status{font:13px monospace;color:#a2dbbf}button{touch-action:manipulation}
</style></head><body><main>
<p class="eyebrow">DAOBLADE / WORLD ART · 037</p><h1>五境山河 · 妖傀有形</h1>
<p>左侧为战斗尺寸，右侧为三倍检视。粉色为脚底锚点，青色为真实身体框；武器与背饰不扩大判定。原画由 AI 辅助生成，经像素整理和分层动作加工。</p>
<div class="controls">
<label>秘境 <select id="realm"><option value="fire">火 · 炉庭</option><option value="wood">木 · 古林</option><option value="earth">土 · 山门</option><option value="metal">金 · 剑冢</option><option value="water">水 · 寒潭</option></select></label>
<label>家族 <select id="family"><option value="guard">普通近战</option><option value="special">特殊近战</option><option value="ranged">远程妖侍</option><option value="boss">秘境首领</option></select></label>
<label>动作 <select id="action"></select></label>
<label>朝向 <select id="face"><option value="1">向右</option><option value="-1">向左</option></select></label>
<label>地图 <select id="layout"><option value="ridge">高径</option><option value="hollow">回廊</option></select></label>
<label>明暗 <select id="light"><option value="0">默认</option><option value="1">明亮</option><option value="-1">暗区</option></select></label>
<button id="pause" class="pixel-button">暂停</button><button id="step" class="pixel-button">逐帧</button>
<label><input type="checkbox" id="boxes" checked>锚点 / 碰撞框</label>
<label>帧 <input id="frame" type="range" min="0" max="1" value="0"></label>
</div>
<p id="art-status" role="status">正在加载本地资源…</p>
<canvas id="preview" width="960" height="540" aria-label="五境怪物和地图素材动画预览"></canvas>
<p id="caption"></p>
<p><a href="/">返回游戏</a> · <a href="/static/character-preview.html">主角预览</a> · 所有图像均来自本地；这里不写入游戏存档。暂停后可检查每一帧，改变朝向不会移动锚点。关闭叠加后可检查真实剪影。</p>
</main>
<script src="/static/js/world-art-assets.js"></script><script src="/static/js/enemy-art.js"></script><script src="/static/js/scene-art.js"></script><script src="/static/js/world-art-preview.js"></script>
</body></html>
